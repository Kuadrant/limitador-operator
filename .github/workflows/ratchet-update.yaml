name: Ratchet Update

on:
  schedule:
    - cron: '42 3 21 * *' # 03:42 UTC on the 21th of every month
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Update pinned actions
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # ratchet:actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.KUADRANT_DEV_PAT }}
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # ratchet:actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run make ratchet-update-all
        run: |
          make ratchet-update-all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # ratchet:peter-evans/create-pull-request@v7
        with:
          commit-message: "deps(ci): update pinned GitHub Actions to latest SHAs"
          committer: kuadrant-dev <kuadrant-dev@redhat.com>
          author: kuadrant-dev <kuadrant-dev@redhat.com>
          token: ${{ secrets.KUADRANT_DEV_PAT }}
          signoff: true
          sign-commits: true
          base: main
          branch: chore/ratchet-update
          delete-branch: true
          title: "deps(ci): update pinned GitHub Actions to latest SHAs"
          body: |
            Automated monthly update of pinned GitHub Actions references.

            Auto-generated by [ratchet-update](https://github.com/Kuadrant/limitador-operator/actions/workflows/ratchet-update.yaml)
          labels: dependencies
